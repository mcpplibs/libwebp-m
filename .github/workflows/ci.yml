name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcpp:
    name: mcpp (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     toolchain: 'gcc@16.1.0' }
          - { os: ubuntu-24.04,     toolchain: 'llvm@23.1.3' }
          - { os: ubuntu-24.04-arm, toolchain: 'gcc@16.1.0' }
          - { os: macos-15,         toolchain: 'llvm@23.1.3' }
          - { os: windows-2025,     toolchain: 'llvm@23.1.3' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mwrap identity and bilingual README contract
        run: python3 tools/check_mwrap_release.py

      - name: Install Xlings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install Xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Select the toolchain
        run: |
          name="${{ matrix.toolchain }}"
          mcpp toolchain install "${name%@*}" "${name#*@}"
          mcpp toolchain default "$name"

      - name: Build the modules (default, and with the demux and mux features)
        run: |
          mcpp build
          mcpp build --features demux,mux

      - name: Tests (the decode and encode API, sharpyuv, the macros, header mixing, pinned bytes)
        run: mcpp test

      - name: Tests, release profile
        run: mcpp test --profile release

      - name: Animation tests (the demux and mux features)
        working-directory: tests/anim
        run: |
          mcpp test
          mcpp test --profile release

      - name: Export audit (the generated modules are fresh; every declaration and macro of the public headers)
        run: python3 tools/check_exports.py

      # Upstream's cwebp and dwebp from the same release, built by its own
      # makefile.unix with the system C compiler: needs make (not on Windows).
      - name: Conformance (examples/webpcodec byte-identical to upstream cwebp and dwebp)
        if: runner.os != 'Windows'
        run: python3 tools/run_conformance.py

      - name: The example builds (Windows)
        if: runner.os == 'Windows'
        working-directory: examples/webpcodec
        run: mcpp build

  # The Web: wasm32-emscripten (emsdk from xlings, through mcpp), the tests
  # under node.
  web:
    name: mcpp (web, wasm32-emscripten)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      XLINGS_NON_INTERACTIVE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/refs/heads/main/tools/other/quick_install.sh | bash
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Install project tools (.xlings.json)
        run: |
          for attempt in 1 2 3; do
            xlings update > /dev/null 2>&1 || true
            if xlings install; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 30
          done
          mcpp --version

      - name: Install emsdk
        run: mcpp toolchain install emsdk 6.0.9

      - name: Tests under node
        run: mcpp test --toolchain emsdk@6.0.9 --target wasm32-emscripten

      - name: Tests under node, release profile
        run: mcpp test --toolchain emsdk@6.0.9 --target wasm32-emscripten --profile release

      - name: Animation tests under node (the demux and mux features)
        working-directory: tests/anim
        run: |
          mcpp test --toolchain emsdk@6.0.9 --target wasm32-emscripten
          mcpp test --toolchain emsdk@6.0.9 --target wasm32-emscripten --profile release
